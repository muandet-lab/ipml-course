# Navigation.
#
# `offering_items` are shown only on pages that belong to a course offering.
# Their URLs are relative to the offering root, so the same list works for
# every year (e.g. `schedule/` -> /ipml-course/2026-2027/schedule/).
offering_items:
  - url: ""
    name: Overview
    icon_class: fa fa-home fa-lg

  - url: "schedule/"
    name: Schedule
    icon_class: fas fa-calendar-alt

  - url: "lectures/"
    name: Lectures
    icon_class: fas fa-book-reader

  - url: "exercises/"
    name: Exercises
    icon_class: fas fa-user-graduate

  - url: "project/"
    name: Project
    icon_class: fas fa-lightbulb

  - url: "references/"
    name: References
    icon_class: fas fa-book

# `site_items` are permanent, offering-independent pages.
#
# `hide_in_offering` marks an entry that has a per-offering counterpart in
# `offering_items`; nav.html skips it while the reader is inside an offering so
# the same tab is not shown twice.
site_items:
  - url: /references/
    name: References
    icon_class: fas fa-book
    hide_in_offering: true

  - url: /archive/
    name: Past Offerings
    icon_class: fas fa-archive
